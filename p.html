<!DOCTYPE html>
<html>                     
    <head>
 <title>the magic color pargraph</title>
 <style>
    #myelement {
        border:1px solid rgb(114, 114, 255);
        background-color: rgb(45, 35, 53);
        color:rgb(255, 250, 250);
        text-decoration: underline;
        text-decoration-color: rgb(205, 152, 255);
        width: 200px;
        height:120px;
    }
 </style>
 <meta charset="utf-8">
    </head>
    <body>
        <h2> the magic color text</h2>
        <div id="myelement">hello world is a bit too boring for me so my message is hello universe</div>
        <br> <br>
      <button type="button" onclick="changestyle()">click this</button>
      <button type="button" onclick="uy()">now this</button>
      <script>
        function changestyle() {
            var element=document.getElementById("myelement");
            element.style.color= "#00FFFF";
        }
        function uy() {
            var element=document.getElementById("myelement")
            element.style.color="rgb(255, 250, 250)";
        }
      </script>
    </body>
</html>
